коло пяти метров высечена из цельного куска серого сердобольского гранита. Над ними работали полторы сотни каменотёсов под руководством скульптора Александра Теребенёва. Петербуржцы верят: если потереть атланту палец ноги — исполнится желание, а студенты перед экзаменами приходят к ним «за удачей»."}]},{name:"Первобытная культура",hall:"Залы 11–12",style:"archaeo",wall:"#3a3631",wall2:"#2e2a26",trim:"#8c7a52",ceiling:"#24211e",floor:"stone",pillar:"none",warden:!0,exhibits:[{id:"malta",title:"Мальтинская «венера»",date:"ок. 23 тыс. лет назад",material:"Бивень мамонта",kind:"case",art:"figurine",text:"Крошечные женские статуэтки из бивня мамонта найдены на палеолитической стоянке Мальта близ Иркутска, которую с 1928 года раскапывал антрополог Михаил Герасимов. Древние охотники Сибири изображали женщин в меховых одеждах с капюшонами — это одно из древнейших в мире свидетельств шитой одежды. Вместе с фигурками нашли изображения летящих птиц, вероятно, связанных с культом плодородия и возрождения жизни."},{id:"maikop",title:"Золотые бычки Майкопского кургана",date:"IV тыс. до н. э.",material:"Золото, серебро",kind:"case",art:"bulls",text:"В 1897 году археолог Николай Веселовский вскрыл огромный курган в Майкопе. В погребении вождя лежали сотни золотых бляшек, сосуды из драгоценных металлов и серебряные стойки балдахина, на которые были надеты отлитые фигурки бычков — два из золота и два из серебра. Этим вещам более пяти тысяч лет: они древнее египетских пирамид Гизы и считаются шедеврами ранней металлургии Кавказа."},{id:"kostroma-stag",title:"Золотой олень из Костромского кургана",date:"VII–VI вв. до н. э.",material:"Золото",kind:"stag",high:!0,text:"Эмблема скифского «звериного стиля». Олень с подогнутыми ногами и огромными ветвистыми рогами, превращёнными в стилизованные завитки, украшал железный щит вождя. Его нашли в 1897 году в Костромском кургане на Кубани. Мастер передал не конкретное животное, а образ стремительного полёта: олень будто мчится, едва касаясь земли. Для скифов он был символом солнца и знаком воинской доблести."},{id:"siberian",title:"Сибирская коллекция Петра I",date:"VII–II вв. до н. э.",material:"Золото, бирюза, сердолик",kind:"case",art:"plaques",text:"Первая археологическая коллекция России. В 1715–1716 годах уральский промышленник Никита Демидов и сибирский губернатор Матвей Гагарин прислали Петру I золотые вещи, извлечённые «бугровщиками» — грабителями древних курганов. Царь был так поражён, что в 1718 году издал указ: всё «зело старое и необыкновенное», найденное в земле, отправлять в Кунсткамеру. Особенно знамениты массивные пряжки-бляхи со сценами борьбы хищников с конями и яками, украшенные цветными вставками. В 1859 году коллекция перешла в Эрмитаж."},{id:"solokha",title:"Гребень из кургана Солоха",date:"Начало IV в. до н. э.",material:"Золото",kind:"case",art:"comb",text:"Золотой гребень найден Николаем Веселовским в 1913 году в кургане Солоха на Днепре. Над рядом зубцов — фриз из пяти лежащих львов, а над ними сцена битвы: конный скиф и пеший воин нападают на третьего, лишившегося коня. Видны мельчайшие детали: складки кафтанов, ремни доспехов, рана на шее коня. Гребень, вероятно, создал греческий ювелир из причерноморской колонии по заказу скифского царя."},{id:"chertomlyk",title:"Чертомлыкская амфора",date:"IV в. до н. э.",material:"Серебро, позолота",kind:"vase",art:"silver",text:"Серебряная амфора высотой около 70 сантиметров найдена в 1863 году при раскопках кургана Чертомлык, которые вёл Иван Забелин. На плечах сосуда изображены скифы, укрощающие и стреноживающие коней, — редкое документальное свидетельство быта кочевников. Амфора служила для вина: его наливали через горловину, а выливали через три носика в виде львиной и конских голов с ситечками."}]},{name:"Искусство Алтая",hall:"Зал 26 · Пазырык",style:"archaeo",wall:"#463a2f",wall2:"#3a3027",trim:"#9c7f4a",ceiling:"#2a231d",floor:"stone",pillar:"none",exhibits:[{id:"pazyryk-carpet",title:"Пазырыкский ковёр",date:"V–IV вв. до н. э.",material:"Шерсть, ворсовое ткачество",kind:"carpet",art:"pazyryk",text:"Древнейший сохранившийся в мире ворсовый ковёр. Его нашёл Сергей Руденко в 1949 году в пятом Пазырыкском кургане на Алтае. Вода проникла в погребальную камеру и превратилась в лёд — вечная мерзлота сохранила ковёр на две с половиной тысячи лет. В центральном поле — ряды звёздчатых розеток, по краям шествуют олени и всадники. На квадратный дециметр приходится около 3600 узлов."},{id:"pazyryk-chariot",title:"Погребальная колесница из Пазырыка",date:"V–IV вв. до н. э.",material:"Берёза, кожа, войлок",kind:"chariot",text:"Высокая четырёхколёсная повозка собрана почти без гвоздей: детали соединены деревянными шипами и ремнями. Колёса диаметром более полутора метров имеют по тридцать четыре спицы. По мнению учёных, колесницу изготовили специально для погребальной процессии знатного человека — по горным тропам Алтая на ней не проехать. Рядом в кургане лежали кони в праздничной упряжи и масках."},{id:"pazyryk-swans",title:"Войлочные лебеди",date:"V–IV вв. до н. э.",material:"Войлок, мех, оленья шерсть",kind:"case",art:"swans",text:"Четыре лебедя из цветного войлока, набитые оленьей шерстью, украшали, по-видимому, навес погребальной колесницы. Они поражают живостью: мастер передал изгиб шеи, оперение крыльев и короткие хвосты. Для древних жителей Алтая птицы были проводниками души в мир предков, поэтому сопровождали умершего в последнем пути."}]},{name:"Золотая кладовая",hall:"Особая кладовая · Золото скифов и греков",style:"coins",wall:"#1f2a3a",wall2:"#18212e",trim:"#d4ab4c",ceiling:"#141b26",floor:"stone",pillar:"pilaster",warden:!0,exhibits:[{id:"kelermes-panther",title:"Пантера из Келермесского кургана",date:"VII в. до н. э.",material:"Золото, цветные вставки",kind:"case",art:"panther",text:"Огромная золотая бляха длиной более тридцати сантиметров украшала щит скифского вождя. Её нашли в 1903 году при раскопках Келермесских курганов на Кубани. Хищник изображён крадущимся, а его хвост и лапы составлены из крошечных свернувшихся кольцом зверей — излюбленный приём «звериного стиля». Глаза и уши когда-то были заполнены цветными вставками, и пантера сверкала на солнце, внушая врагам страх."},{id:"kelermes-axe",title:"Келермесская секира",date:"VII в. до н. э.",material:"Железо, золото",kind:"case",art:"axe",text:"Парадная секира, рукоять и обух которой обложены золотыми пластинами с чеканными изображениями оленей, козлов, львов и фантастических существ. Найдена в Келермесском кургане вместе с пантерой. Стиль изображений выдаёт мастера, знакомого с искусством Древнего Востока — Урарту или Ассирии, — работавшего для скифской знати. Таким оружием не сражались: это был знак власти вождя, который сопровождал его и в загробный мир."},{id:"kuloba-vase",title:"Ваза из кургана Куль-Оба",date:"IV в. до н. э.",material:"Электр (сплав золота и серебра)",kind:"vase",art:"electrum",high:!0,text:"Сосуд найден в 1830 году в кургане Куль-Оба близ Керчи — с этих раскопок началась научная археология Северного Причерноморья. На стенках изображены сцены из жизни скифских воинов: один перевязывает товарищу раненую ногу, другой осматривает ему зуб, третий натягивает тетиву лука. Греческий мастер передал внешность скифов с удивительной точностью: длинные волосы, бороды, расшитые кафтаны и штаны. Некоторые исследователи видят здесь иллюстрацию легенды о происхождении скифского народа."},{id:"bouquet",title:"Букет из драгоценных камней",author:"Жереми Позье",date:"1740-е",material:"Золото, серебро, драгоценные камни",kind:"case",art:"bouquet",text:"Миниатюрный букет, цветы и листья которого выложены драгоценными и полудрагоценными камнями, подобранными по цвету так точно, что цветы выглядят живыми. Его создал придворный ювелир Жереми Позье, швейцарец, более тридцати лет работавший в Петербурге при Елизавете Петровне и Екатерине II. Подобные украшения дамы прикалывали к корсажу или причёске. Сегодня букет хранится в Бриллиантовой кладовой Эрмитажа."}]},{name:"Древний Восток",hall:"Зал Ассирии",style:"east",wall:"#b39566",wall2:"#9e8156",trim:"#6e4b23",ceiling:"#5a3d1f",floor:"stone",pillar:"pilaster",warden:!0,exhibits:[{id:"assyria",title:"Рельеф из дворца Ашшурнасирапала II",date:"IX в. до н. э.",material:"Алебастр",kind:"relief",art:"genius",text:"Плита из Северо-Западного дворца ассирийского царя Ашшурнасирапала II в Нимруде. Крылатый гений-хранитель с шишкой в руке «очищает» царя священной водой. Тысячи таких рельефов покрывали стены дворца, а клинописная надпись, проходящая прямо по фигуре, перечисляет титулы и завоевания царя. Рельефы оставались под землёй почти три тысячи лет, пока в XIX веке их не нашли английские археологи."},{id:"cuneiform",title:"Клинописные таблички Шумера",date:"III тыс. до н. э.",material:"Обожжённая глина",kind:"tablet",text:"Шумеры одними из первых в мире изобрели письменность. Писец выдавливал на сырой глине знаки заострённой тростниковой палочкой — отсюда клиновидная форма штрихов. Большинство табличек — это хозяйственные записи: учёт зерна, скота, жалованья работникам храмов. Таблички в Эрмитаже дошли до нас из шумерских городов Лагаш и Ур."},{id:"urartu",title:"Бронзовые щиты царей Урарту",date:"VIII в. до н. э.",material:"Бронза",kind:"case",art:"shields",high:!0,text:"Найдены при раскопках урартской крепости Тейшебаини на холме Кармир-Блур близ Еревана, которыми руководил Борис Пиотровский — будущий директор Эрмитажа. Щиты украшены поясами шествующих львов и быков, а клинописные надписи сообщают, что они были посвящены богу Халди царями Аргишти I и Сардури II. Крепость погибла в огне в начале VI века до н. э., и обгоревшие руины сохранили для нас её сокровища."},{id:"seals",title:"Печати-цилиндры Месопотамии",date:"IV–I тыс. до н. э.",material:"Камень, лазурит, гематит",kind:"case",art:"seals",text:"Маленький каменный цилиндр с вырезанным изображением прокатывали по сырой глине, оставляя бесконечный рельефный фриз. Такими печатями скрепляли договоры, запечатывали сосуды и двери кладовых. На них — сцены жертвоприношений, битвы героев со львами, мифические существа. Каждая печать была личной подписью владельца, и её часто носили на шнурке на шее."}]},{name:"Древний Египет",hall:"Египетский зал · Зал 100",style:"egypt",wall:"#d9c08a",wall2:"#c7a96b",trim:"#3b6f8f",ceiling:"#1f3a5a",floor:"stone",pillar:"papyrus",warden:!0,exhibits:[{id:"padiiset",title:"Саркофаг и мумия жреца Па-ди-Исета",date:"Ок. X в. до н. э.",material:"Дерево, роспись, мумия",kind:"sarcophagus",text:"Деревянный антропоидный саркофаг жреца, служившего в храме Амона в Фивах. Его поверхность покрыта росписью: богиня неба Нут раскинула крылья, сыновья Гора охраняют внутренности, а иероглифические тексты содержат заклинания для благополучного пути в загробный мир. Мумия, обёрнутая в льняные пелены, — одна из самых известных в музее. Египтяне верили: без сохранённого тела душа «ка» не сможет обрести вечную жизнь."},{id:"amenemhat",title:"Статуя фараона Аменемхета III",date:"XIX в. до н. э.",material:"Чёрный гранит",kind:"statue",art:"pharaoh",text:"Аменемхет III — один из могущественных правителей Среднего царства, при котором Египет переживал расцвет. Он построил грандиозный «Лабиринт» в Фаюмском оазисе, восхищавший позднее греческих путешественников. Скульпторы этой эпохи отошли от идеализации: лицо фараона с тяжёлыми веками и складками у рта выражает усталость и бремя власти."},{id:"sekhmet",title:"Статуи богини Сехмет",date:"XIV в. до н. э.",material:"Гранодиорит",kind:"statue",art:"sekhmet",high:!0,text:"Львиноголовая Сехмет — грозная богиня войны и эпидемий, которая могла и насылать, и исцелять болезни. Фараон Аменхотеп III приказал установить в храме богини Мут в Карнаке сотни её изваяний — по статуе на каждый день года, чтобы умилостивить богиню. Статуи попали в Петербург в 1852 году благодаря писателю и путешественнику Андрею Муравьёву."},{id:"shipwrecked",title:"Папирус «Сказка о потерпевшем кораблекрушение»",date:"XX–XIX вв. до н. э.",material:"Папирус, чернила",kind:"case",art:"papyrus",text:"Одно из древнейших литературных произведений человечества. Моряк рассказывает, как его корабль погиб в бурю, а сам он оказался на волшебном острове, где правил огромный говорящий змей с золотой чешуёй. Змей предсказал герою спасение, и всё сбылось. Папирус обнаружил в собрании Эрмитажа египтолог Владимир Голенищев в 1881 году — с тех пор его называют «Петербургским»."}]},{name:"Античность. Зал Юпитера",hall:"Зал 107",style:"antique",wall:"#8e3b2e",wall2:"#7a3126",trim:"#e6d5a8",ceiling:"#efe5cc",floor:"marble",pillar:"column",chandelier:!0,warden:!0,exhibits:[{id:"jupiter",title:"Статуя Юпитера",date:"Конец I в. н. э.",material:"Мрамор, бронзированный гипс",kind:"statue",art:"jupiter",text:"Колоссальная статуя высотой 3,47 метра когда-то украшала загородную виллу императора Домициана. Верховный бог восседает на троне с орлом у ног, в руке — фигурка богини победы Ники. Мраморными были лишь обнажённые части тела, а плащ изготовлен из позолоченного гипса — так римляне имитировали знаменитые хрисоэлефантинные статуи из золота и слоновой кости. Статуя приобретена в 1861 году вместе с коллекцией маркиза Кампаны."},{id:"tauride",title:"Венера Таврическая",date:"II в. н. э.",material:"Мрамор",kind:"statue",art:"venus",high:!0,text:"Первая античная статуя, привезённая в Россию. Пётр I получил её в 1720 году от папы Климента XI в обмен на мощи святой Бригитты Шведской. Чтобы доставить статую в Петербург, для неё изготовили особую повозку на рессорах. Царь установил Венеру в Летнем саду, а позднее она украшала Таврический дворец — отсюда и название. Это римская копия греческого оригинала III века до н. э."},{id:"hercules",title:"Геракл, побеждающий льва",date:"Римская копия с греческого оригинала школы Лисиппа (IV в. до н. э.)",material:"Мрамор",kind:"statue",art:"hercules",text:"Первый из двенадцати подвигов Геракла — победа над Немейским львом, чью шкуру не брало никакое оружие. Герой задушил зверя голыми руками, а затем носил его шкуру как неуязвимый плащ. Скульптор передал предельное напряжение мышц: тела человека и зверя сплетаются в единый клубок. Мастерская Лисиппа, придворного скульптора Александра Македонского, прославилась именно такими динамичными композициями, рассчитанными на круговой обзор."},{id:"philip",title:"Портрет императора Филиппа Араба",date:"244–249 гг. н. э.",material:"Мрамор",kind:"statue",art:"bust",text:"Марк Юлий Филипп, уроженец римской провинции Аравия, стал императором в эпоху «солдатских императоров», когда правители сменялись почти ежегодно. При нём Рим торжественно отпраздновал своё тысячелетие (248 г.). Скульптор не льстил модели: нахмуренный лоб, глубокие складки, коротко остриженные волосы и щетина, переданная мелкими насечками резца, — перед нами суровый, недоверчивый человек тревожного времени. Это один из шедевров позднеримского портрета."},{id:"syrian",title:"Портрет сирийки",date:"Вторая половина II в. н. э.",material:"Мрамор",kind:"statue",art:"bust",text:"Шедевр римского скульптурного портрета. Неизвестная молодая женщина с тонкими восточными чертами смотрит задумчиво и чуть печально. Скульптор мастерски передал матовость кожи, пряди волос и полуопущенные веки. Римский портрет, в отличие от греческого, стремился к сходству — мы видим живого, конкретного человека, жившего почти две тысячи лет назад."},{id:"gonzaga",title:"Камея Гонзага",date:"III в. до н. э.",material:"Сардоникс",kind:"cameo",text:"Одна из крупнейших и прекраснейших камей мира вырезана александрийским мастером из трёхслойного сардоникса. На ней — профили царя Птолемея II Филадельфа и его супруги и сестры Арсинои II. Камея принадлежала герцогам Гонзага из Мантуи, затем шведской королеве Кристине, папе римскому и, наконец, императрице Жозефине, которая в 1814 году подарила её Александру I."}]},{name:"Зал Августа и Диониса",hall:"Залы 108–109 · Римская скульптура",style:"antique",wall:"#6a5a3a",wall2:"#5a4c30",trim:"#e6d5a8",ceiling:"#efe5cc",floor:"marble",pillar:"column",chandelier:!0,warden:!0,exhibits:[{id:"augustus",title:"Статуя Октавиана Августа в образе Юпитера",date:"I в. н. э.",material:"Мрамор",kind:"statue",art:"augustus",text:"Колоссальная статуя первого римского императора найдена в Кумах близ Неаполя и поступила в Эрмитаж в 1861 году вместе с собранием маркиза Кампаны. Август изображён в облике верховного бога: полуобнажённый, восседающий на троне со скипетром. Так римская пропаганда утверждала божественную природу императорской власти. Хотя Август правил более сорока лет, скульпторы всегда изображали его вечно молодым."},{id:"dionysus",title:"Статуя Диониса",date:"Римская копия II в. н. э. с греческого оригинала",material:"Мрамор",kind:"statue",art:"standing",high:!0,text:"Бог виноделия, плодородия и театра изображён юношей с венком из виноградных листьев. Его культ сопровождался шумными празднествами с музыкой и шествиями ряженых — из этих обрядов в Афинах родились трагедия и комедия. Римляне, почитавшие его под именем Вакха, охотно украшали такими статуями виллы и сады. Это римская копия с греческого оригинала, а зал, где она стоит, назван в честь бога."}]},{name:"Зал Двадцати колонн",hall:"Зал 130 · Античная керамика",style:"antique",wall:"#4a5a66",wall2:"#3f4d58",trim:"#d9c89a",ceiling:"#e8e0c8",floor:"mosaic",pillar:"granite",chandelier:!0,exhibits:[{id:"regina",title:"«Царица ваз»",date:"IV в. до н. э.",material:"Глина, чёрный лак, позолота",kind:"vase",art:"black",text:"Чернолаковая гидрия найдена в 1853 году в некрополе города Кумы близ Неаполя. Её прозвали «Царицей ваз» за совершенство формы и сохранность. Пояс рельефных позолоченных фигур посвящён Элевсинским мистериям — тайным обрядам в честь богини плодородия Деметры и её дочери Персефоны. Сосуд, вероятно, изготовлен в Капуе и служил погребальным даром."},{id:"swallow",title:"Пелика «Прилёт ласточки»",author:"Мастерская Евфрония",date:"Ок. 510 г. до н. э.",material:"Глина, краснофигурная роспись",kind:"vase",art:"redfig",high:!0,text:"На краснофигурной пелике — трое мужчин и мальчик замечают в небе ласточку. Надписи вылетают изо рта персонажей, словно реплики в комиксе: «Смотри, ласточка!» — «Клянусь Гераклом, правда!» — «Вот она! Уже весна!». Это одна из самых ранних в истории искусства «сцен с диалогом» и трогательное свидетельство радости древних афинян приходу весны."},{id:"kolyvan",title:"Колыванская ваза",date:"1829–1843",material:"Ревнёвская яшма",kind:"vase",art:"jasper",text:"«Царица ваз» Колыванской шлифовальной фабрики на Алтае. Чаша диаметром более пяти метров и весом 19 тонн высечена из единого монолита зелёно-волнистой ревнёвской яшмы. Работа заняла четырнадцать лет. Вазу везли на специальных санях, запряжённых полутора сотнями лошадей, затем по рекам на барже. Чтобы установить её в Эрмитаже, пришлось разобрать стену — зал строился вокруг вазы, и вынести её сегодня невозможно."}]}]},{num:2,title:"Второй этаж",subtitle:"Парадные залы Зимнего дворца · Русская культура · Иконопись · Итальянское Возрождение · Западноевропейское искусство",rooms:[{name:"Иорданская лестница",hall:"Посольская лестница",style:"jordan",wall:"#f1ece0",wall2:"#e6dfcd",trim:"#d4ab4c",ceiling:"#bcd3e0",floor:"marble",pillar:"granite",chandelier:!0,windows:!0,exhibits:[{id:"jordan",title:"Иорданская лестница",author:"Ф.-Б. Растрелли, В. П. Стасов",date:"1762; восстановлена 1838–1839",material:"Мрамор, гранит, позолота",kind:"stairs",text:"Главная парадная лестница Зимнего дворца. Своё название получила потому, что по ней в праздник Крещения императорская семья спускалась к Неве на обряд освящения воды — «Иордань». После страшного пожара 1837 года Василий Стасов восстановил лестницу, сохранив замысел Растрелли, но заменив позолоченные деревянные колонны на монолиты серого сердобольского гранита. Плафон с изображением олимпийских богов написан итальянскими мастерами XVIII века."}]},{name:"Фельдмаршальский и Петровский залы",hall:"Залы 193–194",style:"palace",wall:"#f4efe2",wall2:"#ebe3cf",trim:"#d4ab4c",ceiling:"#f7f1e2",floor:"parquet",pillar:"pilaster",chandelier:!0,warden:!0,exhibits:[{id:"fieldmarshal",title:"Фельдмаршальский зал",author:"О. Монферран, В. П. Стасов",date:"1833–1839",kind:"painting",art:"officer",palette:["#2b3a2a","#1f3f6b","#c9a24a"],text:"Зал открывает анфиладу Большой парадной анфилады. Здесь висят парадные портреты русских фельдмаршалов — Румянцева, Суворова, Кутузова, Паскевича и других. Именно отсюда 17 декабря 1837 года начался пожар, уничтоживший интерьеры Зимнего дворца: огонь бушевал больше суток. Однако благодаря самоотверженности солдат и гвардейцев удалось спасти почти все произведения искусства."},{id:"petrovsky",title:"Трон Малого тронного зала",author:"Н. Клаузен",date:"Лондон, 1731",material:"Дуб, серебро, позолота, бархат",kind:"throne",art:"red",text:"Петровский (Малый тронный) зал посвящён памяти Петра Великого. Стены обиты лионским бархатом с вышитыми серебром двуглавыми орлами. Серебряный позолоченный трон изготовлен в Лондоне для императрицы Анны Иоанновны. Над ним — картина Якопо Амигони «Пётр I с богиней мудрости Минервой». В нишах — монограмма Петра из латинских букв и изображения Полтавской и Лесной битв."}]},{name:"Военная галерея 1812 года",hall:"Зал 197",style:"palace",wall:"#f2ecdc",wall2:"#e2d8bf",trim:"#d4ab4c",ceiling:"#f5efe0",floor:"parquet",pillar:"pilaster",chandelier:!0,exhibits:[{id:"military-gallery",title:"Военная галерея 1812 года",author:"Джордж Доу, А. В. Поляков, В. А. Голике",date:"1819–1828",material:"Холст, масло",kind:"portraits",text:"Галерея открыта 25 декабря 1826 года, в годовщину изгнания Наполеона из России. Здесь — 332 портрета генералов, участвовавших в Отечественной войне 1812 года и заграничных походах. Английский художник Джордж Доу с помощниками работал почти десять лет. Некоторые рамы затянуты зелёным шёлком — портреты погибших генералов, чьих изображений не нашлось. Пушкин посвятил галерее стихотворение «Полководец»."},{id:"kutuzov",title:"Портрет М. И. Кутузова",author:"Джордж Доу",date:"1829",material:"Холст, масло",kind:"painting",art:"officer",palette:["#30402e","#1d2e4a","#d4ab4c"],high:!0,text:"Главнокомандующий русской армией, светлейший князь Михаил Илларионович Кутузов изображён в полный рост в шинели, на фоне войск. Портрет создан уже после смерти полководца по прижизненным изображениям. Вместе с портретами Барклая-де-Толли, Александра I, прусского короля Фридриха Вильгельма III и австрийского императора Франца I он занимает почётное место в галерее."}]},{name:"Георгиевский (Большой тронный) зал",hall:"Зал 198",style:"palace",wall:"#f6f1e6",wall2:"#ece3cf",trim:"#e0b850",ceiling:"#f8f2e4",floor:"parquet",pillar:"column",chandelier:!0,windows:!0,warden:!0,exhibits:[{id:"big-throne",title:"Большой императорский трон",author:"Дж. Кваренги, В. П. Стасов",date:"Зал освящён в 1795, восстановлен в 1841",material:"Каррарский мрамор, позолоченная бронза, бархат",kind:"throne",art:"gold",text:"Главный зал Российской империи освящён в день святого Георгия Победоносца, 26 ноября 1795 года. Здесь проходили официальные церемонии и приёмы послов. Над тронным местом — мраморный барельеф «Георгий Победоносец, поражающий змия». Паркет набран из шестнадцати пород дерева и повторяет рисунок потолка. Именно в этом зале в 1906 году Николай II открыл первую Государственную думу."}]},{name:"Гербовый и Николаевский залы",hall:"Залы 191, 195 · Парадная анфилада",style:"palace",wall:"#f4efe2",wall2:"#e8dfc8",trim:"#e0b850",ceiling:"#f7f1e2",floor:"parquet",pillar:"column",chandelier:!0,windows:!0,warden:!0,exhibits:[{id:"gerbovy",title:"Гербовый зал",author:"В. П. Стасов",date:"1839",material:"Акварель Э. П. Гау с видом зала",kind:"painting",art:"ginterior",palette:["#f2e8cc","#e0b850","#c43a2a","#b8c8d0"],text:"Зал предназначался для торжественных приёмов и был восстановлен Василием Стасовым после пожара 1837 года. Его главное украшение — огромные бронзовые люстры, на которых укреплены щиты с гербами российских губерний, отсюда и название. Позолоченные колонны и пилястры поддерживают балконы с балюстрадой, а у входа стоят скульптурные группы древнерусских воинов со знамёнами. Площадь зала — около восьмисот квадратных метров."},{id:"nikolaevsky",title:"Николаевский зал",author:"Дж. Кваренги, В. П. Стасов",date:"1791–1793; восстановлен в 1839",material:"Акварель с видом зала",kind:"painting",art:"ginterior",palette:["#f6f2e6","#e8dcc0","#d4ab4c","#c8d8e0"],high:!0,text:"Самый большой зал Зимнего дворца: его площадь превышает тысячу квадратных метров. Свое название он получил после того, как в нём поместили парадный портрет императора Николая I. Здесь давали самые многолюдные балы, на которые съезжались тысячи гостей, а в пасхальные дни устраивали церемонии христосования. Белоснежные стены, коринфские колонны и люстры с тысячами свечей превращали зал в сверкающее пространство."}]},{name:"Павильонный зал",hall:"Зал 204 · Малый Эрмитаж",style:"pavilion",wall:"#f8f5ee",wall2:"#efe7d4",trim:"#e3bd5a",ceiling:"#fbf7ec",floor:"mosaic",pillar:"column",chandelier:!0,windows:!0,exhibits:[{id:"peacock",title:"Часы «Павлин»",author:"Джеймс Кокс",date:"Лондон, 1770-е",material:"Позолоченная бронза, серебро, стекло",kind:"clock",text:"Знаменитые часы-автомат приобрёл князь Григорий Потёмкин в подарок Екатерине II. В Петербург их привезли в разобранном виде, и многие детали оказались повреждены; собрать механизм удалось русскому самоучке Ивану Кулибину. При заводе сова на вершине дуба вращает головой и мигает, павлин распускает хвост и поворачивается, а петух кукарекает. Циферблат спрятан в шляпке гриба, а цифры бегут по кругу. Это единственный в мире крупный автомат XVIII века, работающий до сих пор."},{id:"pavilion-mosaic",title:"Мозаичный пол Павильонного зала",author:"А. И. Штакеншнейдер",date:"1850-е",material:"Смальта",kind:"fresco",art:"mosaic",high:!0,text:"Зал, созданный архитектором Андреем Штакеншнейдером, соединяет мотивы античности, Возрождения и Востока: белый мрамор, золото, хрустальные люстры и «фонтаны слёз» по образцу Бахчисарайского дворца. В пол вмонтирована уменьшенная копия мозаики, найденной при раскопках римских терм. Из окон зала открывается вид на Висячий сад, разбитый прямо на сводах второго этажа."}]},{name:"Малахитовая гостиная",hall:"Зал 189",style:"malachite",wall:"#f2eadb",wall2:"#e6dcc7",trim:"#d4ab4c",ceiling:"#f2ead8",floor:"parquet",pillar:"malachite",chandelier:!0,windows:!0,exhibits:[{id:"malachite",title:"Малахитовая гостиная",author:"А. П. Брюллов",date:"1838–1839",material:"Уральский малахит, позолоченная бронза",kind:"malachite",text:"Гостиная императрицы Александры Фёдоровны, супруги Николая I. Колонны, пилястры, камины и вазы облицованы уральским малахитом в технике «русской мозаики»: тонкие пластинки камня подбирались по рисунку так, что швы не видны и кажется, будто предмет выточен из цельного куска. На отделку ушло около двух тонн малахита. В 1917 году здесь проходили последние заседания Временного правительства."}]},{name:"История русской культуры",hall:"Залы 151–155",style:"russian",wall:"#2f5e4f",wall2:"#285244",trim:"#d4ab4c",ceiling:"#f0e8d4",floor:"parquet",pillar:"pilaster",chandelier:!0,warden:!0,exhibits:[{id:"nevsky-shrine",title:"Серебряная рака Александра Невского",date:"1747–1752",material:"Серебро",kind:"shrine",text:"Монументальная гробница-усыпальница для мощей святого князя Александра Невского создана по повелению императрицы Елизаветы Петровны на Санкт-Петербургском монетном дворе. На неё ушло около полутора тонн серебра — первого серебра с Колыванских рудников Алтая. Рельефы рассказывают о Невской битве, Ледовом побоище и жизни князя. В 1922 году рака была передана в Эрмитаж."},{id:"wax-peter",title:"«Восковая персона» Петра I",author:"Б.-К. Растрелли",date:"1725",material:"Воск, дерево, ткань",kind:"statue",art:"wax",high:!0,text:"Скульптор Бартоломео Карло Растрелли, отец знаменитого архитектора, снял с лица Петра маску ещё при жизни царя, а после его кончины — посмертную. По ним и точным меркам была создана сидящая фигура императора в натуральную величину. На ней подлинная одежда Петра: голубой гроденаплевый кафтан, в котором он был на коронации Екатерины I, шпага и орден Андрея Первозванного. Рост Петра — 2 метра 4 сантиметра."},{id:"nartov",title:"Токарно-копировальный станок",author:"А. К. Нартов",date:"1718–1729",material:"Дерево, металл",kind:"case",art:"lathe",text:"Пётр I увлекался токарным делом и проводил за станком многие часы. Его личный токарь, механик Андрей Нартов, создал станки, позволявшие копировать рельефы и вытачивать сложнейшие медальоны. Нартов изобрёл механический суппорт — держатель резца, который на десятилетия опередил европейских изобретателей. В Эрмитаже хранятся станки и выточенные на них Петром изделия."},{id:"catherine",title:"Портрет Екатерины II перед зеркалом",author:"Вигилиус Эриксен",date:"1762–1764",material:"Холст, масло",kind:"painting",art:"empress",palette:["#5a6e8c","#e8d7b8","#c9a24a"],text:"Основательница Эрмитажа. В 1764 году Екатерина II приобрела у берлинского купца Гоцковского 225 картин — этот год считается годом рождения музея. «Только мыши да я любуемся всем этим», — шутила императрица о своём «уединённом месте», эрмитаже. Датский художник Эриксен изобразил её в роскошном платье перед зеркалом, где отражается её профиль — приём, подчёркивающий величие."}]},{name:"Иконопись",hall:"Византия и Древняя Русь",style:"icon",wall:"#20304a",wall2:"#1a283e",trim:"#d9b25a",ceiling:"#141f33",floor:"stone",pillar:"pilaster",exhibits:[{id:"pantocrator",title:"Христос Пантократор",date:"Константинополь, 1363",material:"Дерево, темпера",kind:"icon",art:"christ",text:"Одна из самых совершенных византийских икон поздней эпохи. Она была написана для монастыря Пантократора на горе Афон по заказу великого примикирия Алексея и его брата Иоанна — их имена указаны в надписи. Образ Христа-Вседержителя с Евангелием в руке исполнен спокойного величия. Икона привезена в Россию в XIX веке собирателем Петром Севастьяновым."},{id:"gregory",title:"Святой Григорий Чудотворец",date:"Константинополь, XII век",material:"Дерево, темпера, золото",kind:"icon",art:"saint",high:!0,text:"Святитель Григорий, епископ Неокесарии, прославился чудесами и обращением в христианство почти всей своей паствы. Икона — редкий образец константинопольской живописи эпохи Комнинов. Обратите внимание на тончайшую проработку лица, золотой фон и пробела — светлые штрихи, которые создают ощущение внутреннего сияния. Такие иконы служили образцом для мастеров Древней Руси."},{id:"novgorod",title:"Новгородская иконопись",date:"XIV–XVI века",material:"Дерево, темпера",kind:"icon",art:"george",text:"Новгородская школа отличается звучным киноварно-красным цветом, ясными силуэтами и энергией композиции. Особенно любимы в Новгороде были «народные» святые-защитники: Георгий Победоносец, Николай Чудотворец, Флор и Лавр — покровители коней, Илья Пророк. В собрании Эрмитажа хранятся десятки новгородских икон, поступивших из церквей и частных коллекций."}]},{name:"Зал Леонардо да Винчи",hall:"Зал 214",style:"renaissance",wall:"#7d2a2a",wall2:"#6a2222",trim:"#d4ab4c",ceiling:"#efe3c6",floor:"parquet",pillar:"pilaster",damask:!0,chandelier:!0,warden:!0,exhibits:[{id:"litta",title:"Мадонна Литта",author:"Леонардо да Винчи",date:"Ок. 1490–1491",material:"Холст (переведена с дерева), темпера",kind:"painting",art:"madonna",palette:["#16202e","#2a4b8d","#b33a2c","#7aa0c4"],text:"Мадонна кормит младенца, а он, держа в руке щегла — символ будущих страданий, — смотрит прямо на зрителя. За двумя арочными окнами — голубые горы. Картина написана в Милане и в XIX веке принадлежала семье герцогов Литта, от которых и получила название. Александр II купил её в 1865 году. Среди исследователей до сих пор идут споры, какую часть работы выполнил сам Леонардо, а какую — его ученики."},{id:"angelico",title:"Мадонна с младенцем, святыми Домиником и Фомой Аквинским",author:"Фра Беато Анджелико",date:"1424–1430",material:"Фреска",kind:"fresco",art:"angelico",text:"Монах-доминиканец Фра Беато Анджелико («Блаженный Ангельский») писал фрески для монастыря Сан-Доменико во Фьезоле, где сам принял постриг. Эта фреска украшала одно из помещений обители. В XIX веке её вместе со слоем штукатурки сняли со стены — сложнейшая операция — и перевезли в Петербург. Мягкий свет, чистые голубые и розовые тона, тихая сосредоточенность святых передают созерцательный дух ранней флорентийской живописи."},{id:"benois",title:"Мадонна Бенуа (Мадонна с цветком)",author:"Леонардо да Винчи",date:"1478–1480",material:"Холст (переведена с дерева), масло",kind:"painting",art:"madonna2",palette:["#2a2a24","#3a5b8c","#d7c08a","#6d7f5a"],high:!0,text:"Одно из первых самостоятельных произведений молодого Леонардо. Юная мать с улыбкой протягивает младенцу цветок крестоцвета, и он сосредоточенно пытается его схватить — живая, почти бытовая сцена. Картину долго считали утраченной, пока в 1909 году архитектор Леонтий Бенуа не показал её на выставке. В 1914 году семья Бенуа уступила картину Эрмитажу за символическую цену."}]},{name:"Зал Рафаэля и Микеланджело",hall:"Залы 229–230",style:"renaissance",wall:"#3e5a7a",wall2:"#334c68",trim:"#d4ab4c",ceiling:"#f1e7cc",floor:"parquet",pillar:"pilaster",chandelier:!0,exhibits:[{id:"conestabile",title:"Мадонна Конестабиле",author:"Рафаэль Санти",date:"Ок. 1504",material:"Холст (переведена с дерева), темпера",kind:"painting",art:"tondo",palette:["#8fb0c8","#264a8a","#c0443a","#6d8a5a"],text:"Миниатюрный тондо (круглая картина) диаметром всего 17,5 сантиметра написан двадцатилетним Рафаэлем в Умбрии. Мадонна читает книгу, а младенец тянется к её страницам. На фоне — весенний пейзаж с заснеженными вершинами. Картина принадлежала графам Конестабиле делла Стаффа из Перуджи; в 1870 году Александр II купил её в подарок императрице Марии Александровне. Позолоченная рама изготовлена по рисунку самого Рафаэля."},{id:"holy-family",title:"Святое семейство (Мадонна с безбородым Иосифом)",author:"Рафаэль Санти",date:"Ок. 1506",material:"Холст (переведена с дерева), темпера, масло",kind:"painting",art:"family",palette:["#2b2a26","#2b4f8f","#c0443a","#a07a4a"],text:"Флорентийский период Рафаэля. Мадонна, младенец Христос и молодой, непривычно безбородый Иосиф образуют уравновешенную треугольную композицию. Иосиф опирается на посох и задумчиво смотрит на младенца. Картина поступила в Эрмитаж в 1772 году из знаменитого собрания Кроза — одной из крупнейших покупок Екатерины II."},{id:"crouching",title:"Скорчившийся мальчик",author:"Микеланджело Буонарроти",date:"Ок. 1530–1534",material:"Мрамор",kind:"statue",art:"crouch",high:!0,text:"Единственная работа Микеланджело в России. Незаконченная фигура мальчика, склонившегося к ступне, полна внутреннего напряжения: тело будто сжато пружиной. Скульптура, вероятно, предназначалась для капеллы Медичи во Флоренции. Её купила Екатерина II в 1785 году из коллекции английского банкира Лайда Брауна. На камне видны следы резца мастера."},{id:"loggia",title:"Лоджии Рафаэля",author:"Дж. Кваренги, Х. Унтербергер",date:"1783–1792",material:"Темпера по холсту",kind:"fresco",art:"loggia",text:"Екатерина II, восхищённая гравюрами с ватиканских лоджий, расписанных учениками Рафаэля, заказала их точную копию. Архитектор Джакомо Кваренги построил для неё специальный корпус вдоль Зимней канавки, а группа художников под руководством Христофора Унтербергера в Риме копировала росписи на холстах. Тринадцать арок украшают сцены из Ветхого и Нового Завета — «Библия Рафаэля» — и причудливые гротески."}]},{name:"Зал Тициана и венецианцев",hall:"Зал 221",style:"renaissance",wall:"#6b2236",wall2:"#5a1c2d",trim:"#d4ab4c",ceiling:"#eee2c4",floor:"parquet",pillar:"pilaster",damask:!0,chandelier:!0,warden:!0,exhibits:[{id:"titian-danae",title:"Даная",author:"Тициан",date:"1554 или позже",material:"Холст, масло",kind:"painting",art:"reclining",palette:["#3b2a1e","#e0b88a","#7a2020","#e6c66f"],text:"Тициан несколько раз обращался к мифу о царевне Данае, заточённой отцом в башне, к которой Зевс проник в виде золотого дождя. В эрмитажной версии рядом с Данаей старая служанка подставляет фартук, жадно ловя падающие монеты, — контраст возвышенной любви и корысти. Поздняя манера Тициана поразительна: краски нанесены свободными мазками, иногда пальцами."},{id:"magdalene",title:"Кающаяся Мария Магдалина",author:"Тициан",date:"1560-е",material:"Холст, масло",kind:"painting",art:"magdalene",palette:["#2a2420","#c99a5e","#e6c88f","#5c6a7a"],high:!0,text:"Эту картину Тициан не продавал до конца жизни — она оставалась в его мастерской в Венеции. Магдалина с заплаканными глазами обращает взгляд к небу, рядом — раскрытая книга и череп, символ бренности. Роскошные рыжие волосы окутывают фигуру. Полотно было куплено для Эрмитажа в 1850 году вместе с коллекцией венецианского дворца Барбариго."},{id:"lute",title:"Лютнист",author:"Микеланджело Меризи да Караваджо",date:"Ок. 1595–1596",material:"Холст, масло",kind:"painting",art:"lute",palette:["#16120e","#f2ead8","#8a5a2a","#c94a3a"],text:"Юный музыкант в белой рубашке перебирает струны лютни, а перед ним — раскрытые ноты, скрипка и ваза с цветами. Караваджо выхватывает фигуру из темноты резким направленным светом — этот приём, кьяроскуро, сделал его одним из самых влиятельных художников Европы. В нотах можно разобрать реальный мадригал о любви. Картина написана для кардинала дель Монте или маркиза Джустиниани, а в 1808 году её приобрёл для Эрмитажа Александр I."},{id:"judith",title:"Юдифь",author:"Джорджоне",date:"Ок. 1504",material:"Холст (переведена с дерева), масло",kind:"painting",art:"judith",palette:["#4a5a3a","#c25a4a","#e8d6b0","#8aa0b0"],text:"Библейская героиня Юдифь спасла свой город, обезглавив вражеского полководца Олоферна. Но у Джорджоне она не грозная мстительница: задумчивая и спокойная, она стоит в мирном пейзаже, наступив на голову врага. Долгое время картину приписывали Рафаэлю, и лишь в XIX веке установили настоящего автора. Работ Джорджоне в мире сохранилось очень мало — меньше двух десятков."}]},{name:"Галерея истории древней живописи",hall:"Зал 241 · Скульптура Кановы",style:"pavilion",wall:"#e8e2d2",wall2:"#d8d0bc",trim:"#c9a24a",ceiling:"#f4eedf",floor:"mosaic",pillar:"column",chandelier:!0,exhibits:[{id:"canova-graces",title:"Три грации",author:"Антонио Канова",date:"1813–1816",material:"Мрамор",kind:"statue",art:"graces",text:"Три дочери Зевса — Аглая (сияние), Евфросина (радость) и Талия (цветение) — нежно обнимают друг друга. Скульптуру заказала императрица Жозефина, первая жена Наполеона, но она умерла, не дождавшись окончания работы. Группа перешла к её сыну Евгению Богарне, а через его потомков, герцогов Лейхтенбергских, породнившихся с российской императорской семьёй, попала в Петербург. Канова так тонко отполировал мрамор, что он кажется тёплым и мягким."},{id:"canova-psyche",title:"Амур и Психея",author:"Антонио Канова",date:"1796–1800",material:"Мрамор",kind:"statue",art:"pair",high:!0,text:"Юный бог любви Амур и смертная девушка Психея стоят, прильнув друг к другу. Психея кладёт на ладонь возлюбленного бабочку — по-гречески её имя означает и «душа», и «бабочка». Миф рассказывает, как Психея прошла через тяжкие испытания, чтобы вернуть любовь Амура, и в награду получила бессмертие. Канова, главный скульптор неоклассицизма, вдохновлялся античностью, но наполнил её чувствительностью своего времени."}]},{name:"Рыцарский зал",hall:"Зал 243 · Западноевропейское оружие",style:"palace",wall:"#8a7a62",wall2:"#6a5c48",trim:"#c9a24a",ceiling:"#e8dcc0",floor:"marble",pillar:"pilaster",chandelier:!0,warden:!0,exhibits:[{id:"knights",title:"Конные рыцари в доспехах",date:"XVI век",material:"Сталь, гравировка, позолота, кожа",kind:"armor",art:"knight",text:"Коллекция западноевропейского оружия Эрмитажа насчитывает тысячи предметов. Её основу составило собрание Арсенала в Царском Селе, созданное Николаем I и переданное в музей в 1880-х годах. В центре Рыцарского зала Нового Эрмитажа выстроены конные рыцари в полных доспехах — и сами всадники, и их кони закованы в сталь. Полный доспех весил двадцать–тридцать килограммов, а лучшие оружейники Нюрнберга и Аугсбурга украшали его гравировкой, чернением и позолотой."}]},{name:"Испанская живопись",hall:"Залы 239–240",style:"renaissance",wall:"#5a2a1e",wall2:"#4a2218",trim:"#d4ab4c",ceiling:"#eee2c4",floor:"parquet",pillar:"pilaster",damask:!0,chandelier:!0,warden:!0,exhibits:[{id:"velazquez",title:"Завтрак",author:"Диего Веласкес",date:"Ок. 1617–1618",material:"Холст, масло",kind:"painting",art:"gtable",palette:["#2a2018","#8a5a30","#e8dcc0","#6a7a4a"],text:"Одна из самых ранних работ Веласкеса, написанная в Севилье, когда художнику было около восемнадцати лет. За скромным столом сидят трое — старик, юноша и мальчик, — перед ними хлеб, гранат, рыба и вино. Такие сцены в харчевнях назывались «бодегонами», и молодой мастер оттачивал на них умение передавать фактуру предметов и игру света. Позже Веласкес станет придворным живописцем короля Филиппа IV."},{id:"elgreco",title:"Апостолы Пётр и Павел",author:"Эль Греко",date:"1587–1592",material:"Холст, масло",kind:"painting",art:"gsaints",palette:["#3a3a3a","#d8a83a","#b83a2a","#6a7a8a"],text:"Пожилой апостол Пётр с ключами от рая, в жёлтом плаще, и энергичный Павел в красном, положивший руку на раскрытую книгу. Эль Греко — грек с острова Крит, учившийся в Венеции и обосновавшийся в испанском Толедо, — изображал святых вытянутыми, с нервными длинными пальцами и одухотворёнными лицами. Этот приём сделал его стиль узнаваемым. Картину подарил Эрмитажу в 1911 году коллекционер П. П. Дурново."},{id:"murillo",title:"Мальчик с собакой",author:"Бартоломе Эстебан Мурильо",date:"1650-е",material:"Холст, масло",kind:"painting",art:"gchild",palette:["#3a3226","#8a6a4a","#c8a070","#7a8aa0"],high:!0,text:"Севильский художник Мурильо прославился образами уличных детей — бедных, но жизнерадостных. Мальчик с корзиной за плечом с лукавой улыбкой оборачивается к собаке, будто дразня её. Тёплые коричневые тона, мягкий свет и живая непосредственность сцены сделали такие картины невероятно популярными у коллекционеров XVIII века по всей Европе. Екатерина II охотно приобретала работы Мурильо."},{id:"zurbaran",title:"Отрочество Богоматери",author:"Франсиско де Сурбаран",date:"Ок. 1660",material:"Холст, масло",kind:"painting",art:"gpray",palette:["#2a1e16","#c84a3a","#e8dcc0","#d8b860"],text:"Юная Мария прервала рукоделие и молится, подняв глаза к небу. Рядом — корзинка с шитьём и белые лилии, символ чистоты. Сурбаран, которого называли «испанским Караваджо» за резкий контраст света и тени, в поздние годы писал мягче и нежнее. Простые предметы на его полотнах выписаны так тщательно, что кажутся осязаемыми, а сцена дышит тишиной и сосредоточенностью."}]},{name:"Зал Рубенса",hall:"Зал 247 · Фламандская живопись",style:"renaissance",wall:"#6a2a2a",wall2:"#5a2222",trim:"#d4ab4c",ceiling:"#efe3c6",floor:"parquet",pillar:"pilaster",damask:!0,chandelier:!0,warden:!0,exhibits:[{id:"rubens-earth",title:"Союз Земли и Воды",author:"Питер Пауль Рубенс",date:"Ок. 1618",material:"Холст, масло",kind:"painting",art:"gmyth",palette:["#4a6a8a","#e8c098","#b84a2a","#6a8a4a"],text:"Аллегория: богиня земли Кибела и морской бог Нептун скрепляют союз, а крылатая Слава венчает богиню короной. У их ног — речной бог с урной, из которой льётся вода, и тритон, трубящий в раковину. Многие исследователи видят здесь мечту Фландрии о выходе к морю: устье реки Шельды было перекрыто голландцами, и Антверпен, родной город Рубенса, терял морскую торговлю."},{id:"rubens-perseus",title:"Персей и Андромеда",author:"Питер Пауль Рубенс",date:"Ок. 1620–1622",material:"Холст (переведена с дерева), масло",kind:"painting",art:"gmyth2",palette:["#5a7a9a","#e8c8a8","#b8322a","#f2ead8"],text:"Герой Персей, победив морское чудовище, освобождает прикованную к скале царевну Андромеду. Рядом нетерпеливо бьёт копытом крылатый конь Пегас, а богиня Победы венчает героя лавровым венком. Вокруг резвятся амуры. Картина, полная движения и света, поступила в Эрмитаж в 1769 году вместе с коллекцией саксонского графа Брюля."},{id:"vandyck",title:"Автопортрет",author:"Антонис ван Дейк",date:"Конец 1620-х — начало 1630-х",material:"Холст, масло",kind:"painting",art:"gportrait",palette:["#2a2420","#1a1a1a","#6a4a2a","#e8e0d0"],text:"Ван Дейк — самый талантливый ученик Рубенса, ставший затем придворным художником английского короля Карла I. На автопортрете — изысканный молодой человек с тонким лицом, светлыми вьющимися волосами и длинными аристократическими пальцами. Элегантная небрежность позы определила стиль английского парадного портрета на столетие вперёд. Картина поступила в 1779 году в составе знаменитой коллекции английского премьер-министра Роберта Уолпола."},{id:"snyders",title:"Рыбная лавка",author:"Франс Снейдерс",date:"1610-е годы",material:"Холст, масло",kind:"painting",art:"gmarket",palette:["#2a2a24","#a8b0b0","#c84a2a","#5a6a4a"],text:"Франс Снейдерс создал серию из четырёх огромных «Лавок» — рыбной, фруктовой, овощной и дичи — по заказу епископа Брюгге. Длинный стол ломится от изобилия: лососи, осётр, угри, крабы, раки, тюлень. Каждая чешуйка и влажный блеск рыбы переданы с удивительным мастерством. Вся серия попала в Эрмитаж в 1779 году из собрания Уолпола и занимает целую стену зала."}]},{name:"Шатровый зал",hall:"Зал 249 · Голландская живопись",style:"renaissance",wall:"#3a5a4a",wall2:"#2e4a3c",trim:"#d4ab4c",ceiling:"#efe3c6",floor:"parquet",pillar:"pilaster",chandelier:!0,exhibits:[{id:"hals",title:"Портрет молодого человека с перчаткой",author:"Франс Хальс",date:"Ок. 1650",material:"Холст, масло",kind:"painting",art:"gportrait",palette:["#4a4436","#1a1a1a","#5a3a1e","#f2ede0"],text:"Франс Хальс из Харлема писал стремительными, широкими мазками, которые вблизи кажутся небрежными, а издали складываются в живое лицо. Неизвестный молодой человек в чёрном костюме с белым воротником держит перчатку и смотрит на нас с лёгкой улыбкой. Картина входила в собрание берлинского купца Гоцковского, приобретённое Екатериной II в 1764 году, — то самое, с которого начался Эрмитаж."},{id:"ruisdael",title:"Болото",author:"Якоб ван Рейсдал",date:"1660-е",material:"Холст, масло",kind:"painting",art:"glandscape",palette:["#8aa0b0","#2a3a24","#4a5a3a","#c8c0a0"],text:"Глухой лесной водоём, заросший кувшинками, окружён могучими дубами и буками; некоторые из них уже повалены бурей и гниют в воде. Якоб ван Рейсдал — величайший пейзажист Голландии — умел передать в, казалось бы, простом мотиве мысль о вечном круговороте жизни и смерти в природе. Мрачноватая поэзия его картин предвосхитила романтизм XIX века."}]},{name:"Французское искусство",hall:"Залы 279–288 · XVII–XVIII века",style:"renaissance",wall:"#3e5a7a",wall2:"#334c68",trim:"#d4ab4c",ceiling:"#f1e7cc",floor:"parquet",pillar:"pilaster",chandelier:!0,warden:!0,exhibits:[{id:"poussin",title:"Танкред и Эрминия",author:"Никола Пуссен",date:"1630-е",material:"Холст, масло",kind:"painting",art:"gmyth3",palette:["#5a6a8a","#d8b890","#2a4a8a","#c8a050"],text:"Сюжет взят из поэмы Торквато Тассо «Освобождённый Иерусалим». Сарацинская царевна Эрминия, тайно влюблённая в крестоносца Танкреда, находит его раненым после поединка и отрезает мечом свои волосы, чтобы перевязать его раны. Рядом — верный оруженосец и два коня. Пуссен, основоположник классицизма, строил композицию как театральную сцену, где каждый жест исполнен смысла."},{id:"watteau",title:"Савояр с сурком",author:"Антуан Ватто",date:"1716",material:"Холст, масло",kind:"painting",art:"gchild2",palette:["#a8b8a0","#6a5a3a","#c8a070","#8a9aa8"],text:"Бедный мальчик из горной Савойи — такие подростки бродили по Франции с ручными сурками, зарабатывая на жизнь мелкими представлениями. За его спиной — короб, в котором живёт зверёк, а вдали виден тихий провинциальный городок. Ватто, певец изящных «галантных празднеств», здесь написал простую и трогательную сцену, полную сочувствия к герою."},{id:"houdon",title:"Вольтер в кресле",author:"Жан-Антуан Гудон",date:"1781",material:"Мрамор",kind:"statue",art:"voltaire",high:!0,text:"Великий философ изображён в возрасте восьмидесяти трёх лет, незадолго до смерти: в просторном одеянии, напоминающем античную тогу, с насмешливой улыбкой на старческом лице. Говорят, Гудон добился этой улыбки, рассказывая Вольтеру анекдоты во время сеансов. Екатерина II, много лет переписывавшаяся с философом, заказала мраморное повторение статуи, а после его смерти купила всю его библиотеку."},{id:"falconet",title:"Амур грозящий",author:"Этьен Морис Фальконе",date:"1757–1758",material:"Мрамор",kind:"statue",art:"cupid",text:"Шаловливый мальчик-Амур сидит на облаке, прижав палец к губам, и тайком тянется к колчану за стрелой. Это предостережение влюблённым: храните свою тайну! Первый вариант скульптуры Фальконе создал для маркизы де Помпадур, фаворитки Людовика XV. Позже, по приглашению Екатерины II, Фальконе приехал в Петербург и создал здесь свой главный шедевр — Медного всадника."},{id:"chardin",title:"Натюрморт с атрибутами искусств",author:"Жан Батист Симеон Шарден",date:"1766",material:"Холст, масло",kind:"painting",art:"gstill",palette:["#4a4030","#c8a060","#b8322a","#e8e0d0"],text:"Гипсовая статуэтка, палитра с кистями, чертёжные инструменты, папка с рисунками и орден на ленте — всё, что символизирует живопись, скульптуру и архитектуру. Картину заказала Екатерина II для конференц-зала петербургской Академии художеств, но, увидев готовую работу, оставила её у себя. Шарден превращал скромные предметы в поэзию тишины."}]},{name:"Немецкое и английское искусство",hall:"Залы 263–268, 298–301",style:"renaissance",wall:"#4a4a6a",wall2:"#3c3c5a",trim:"#d4ab4c",ceiling:"#efe3c6",floor:"parquet",pillar:"pilaster",chandelier:!0,exhibits:[{id:"cranach",title:"Венера и Амур",author:"Лукас Кранах Старший",date:"1509",material:"Холст (переведена с дерева), масло",kind:"painting",art:"gvenus",palette:["#141414","#f0dcc8","#c8a040","#e8d8c0"],text:"Одно из первых в немецкой живописи изображений античной богини. Стройная Венера стоит на тёмном фоне, а маленький Амур рядом держит лук. Латинская надпись вверху предупреждает: «Всеми силами гони сладострастие Купидона, иначе твоей ослеплённой душой овладеет Венера». Кранах, друг Мартина Лютера, соединил в картине античный сюжет с назидательностью эпохи Реформации."},{id:"friedrich",title:"На паруснике",author:"Каспар Давид Фридрих",date:"1818–1819",material:"Холст, масло",kind:"painting",art:"gsail",palette:["#c8b890","#4a3a2a","#7a8a9a","#e8d8a8"],text:"Мужчина и женщина, взявшись за руки, сидят на носу парусника и смотрят на далёкий, тающий в дымке город. Картина написана вскоре после женитьбы художника и, возможно, изображает его самого с молодой женой. Это романтический образ жизненного пути и надежды. В 1820 году великий князь Николай Павлович, будущий император Николай I, посетил мастерскую Фридриха в Дрездене и приобрёл картину."},{id:"gainsborough",title:"Дама в голубом",author:"Томас Гейнсборо",date:"Конец 1770-х",material:"Холст, масло",kind:"painting",art:"gportrait2",palette:["#4a5a5a","#8ab0c8","#e8e0d4","#c8b8a0"],text:"Неизвестная молодая женщина в голубом платье с пышной напудренной причёской смотрит на нас с мягкой задумчивостью. Лёгкие, словно скользящие мазки Гейнсборо создают ощущение воздушности. Имя модели до сих пор спорно — возможно, это герцогиня Бофорт. Единственная работа художника в России поступила в Эрмитаж в 1916 году по завещанию коллекционера А. З. Хитрово."}]}]},{num:3,title:"Третий этаж",subtitle:"Запасные галереи · Импрессионисты и искусство XX века · Нумизматика · Искусство стран Азии",rooms:[{name:"Запасные галереи. Голландия",hall:"Открытое хранение",style:"storage",wall:"#5d6168",wall2:"#52565c",trim:"#b49a5a",ceiling:"#3a3d42",floor:"concrete",pillar:"rack",warden:!0,exhibits:[{id:"prodigal",title:"Возвращение блудного сына",author:"Рембрандт ван Рейн",date:"Ок. 1668",material:"Холст, масло",kind:"painting",art:"prodigal",palette:["#1d140c","#b2321e","#d8b06a","#5a3a1e"],text:"Одна из последних и самых глубоких картин Рембрандта. Измождённый сын в лохмотьях опустился на колени перед ослепшим отцом, и тот с бесконечной нежностью обнимает его плечи. Тёплый золотистый свет выхватывает их из темноты, а свидетели застыли в молчании. Полотно размером почти 2,6 на 2 метра купила Екатерина II в 1766 году. Это притча о прощении, созданная художником, пережившим потерю близких."},{id:"rembrandt-danae",title:"Даная",author:"Рембрандт ван Рейн",date:"1636",material:"Холст, масло",kind:"painting",art:"reclining2",palette:["#2a1c10","#e8c27a","#8a3a1e","#d6a24a"],high:!0,text:"Рембрандт трактовал миф по-своему: вместо золотого дождя — сияющий свет, к которому Даная радостно тянет руку. Над ложем рыдает скованный золотой амур. 15 июня 1985 года душевнобольной посетитель плеснул на полотно серную кислоту и нанёс два удара ножом. Реставраторы Эрмитажа двенадцать лет спасали картину, и в 1997 году она вернулась в экспозицию — с сохранёнными следами трагедии."},{id:"rembrandt-flora",title:"Флора",author:"Рембрандт ван Рейн",date:"1634",material:"Холст, масло",kind:"painting",art:"gflora",palette:["#2a2418","#7a9a6a","#e8c890","#c8506a"],text:"В год свадьбы с Саскией ван Эйленбюрх Рембрандт изобразил её в образе Флоры — римской богини весны и цветов. Молодая женщина в роскошном расшитом наряде держит посох, увитый цветами, а на голове у неё — венок. Мерцающий тёплый свет и бархатистые ткани выдают руку молодого, уже знаменитого амстердамского мастера, влюблённого и счастливого."},{id:"rembrandt-abraham",title:"Жертвоприношение Авраама",author:"Рембрандт ван Рейн",date:"1635",material:"Холст, масло",kind:"painting",art:"gangel",palette:["#1e1810","#d8b070","#8a6a3a","#e8dcc0"],text:"Бог повелел Аврааму принести в жертву единственного сына Исаака, и старик повиновался. В последний миг ангел перехватывает его руку — нож выпадает и словно застывает в воздухе. Рембрандт выбрал самый драматичный момент библейской истории. Картина поступила в Эрмитаж в 1779 году из собрания Уолпола."}]},{name:"Импрессионисты",hall:"Главный штаб · Залы Щукина и Морозова",style:"modern",wall:"#f2f0ea",wall2:"#e2dfd6",trim:"#9a9a96",ceiling:"#ebe8e0",floor:"parquet",pillar:"none",warden:!0,exhibits:[{id:"monet",title:"Дама в саду",author:"Клод Моне",date:"1867",material:"Холст, масло",kind:"painting",art:"gimpression",palette:["#6a9a4a","#f2f0e8","#c83a2a","#a8c8e0"],text:"Молодой Моне написал сад своей тётки в Сент-Адрес на берегу Ла-Манша. Дама в белом платье с зонтиком стоит у клумбы красных цветов, а солнечный свет пронизывает листву и ложится на дорожку пятнами. Художник работал под открытым небом, стремясь поймать мимолётное состояние света, — до рождения слова «импрессионизм» оставалось ещё семь лет. Картина входила в собрание Сергея Щукина."},{id:"pissarro",title:"Бульвар Монмартр в Париже",author:"Камиль Писсарро",date:"1897",material:"Холст, масло",kind:"painting",art:"gboulevard",palette:["#b8b8b0","#6a6a60","#d8c8a0","#4a5a6a"],text:"Пожилой Писсарро, страдавший болезнью глаз, снял номер в гостинице и из окна писал парижский бульвар в разное время суток и в разную погоду — получилась серия из полутора десятков полотен. Широкая улица уходит вдаль, по ней движутся экипажи и прохожие, а деревья только начинают зеленеть. Мазки передают ощущение влажного воздуха и шума большого города."},{id:"cezanne",title:"Курильщик",author:"Поль Сезанн",date:"Ок. 1890–1892",material:"Холст, масло",kind:"painting",art:"gsmoker",palette:["#8a7a5a","#3a4a6a","#c8946a","#6a5a3a"],text:"Крестьянин из Прованса облокотился на стол и задумчиво курит трубку. Сезанн писал местных крестьян, усаживая их часами позировать в своей мастерской. Он стремился выявить в каждой форме её простую основу — «трактовать природу посредством цилиндра, шара и конуса». Этот поиск сделал Сезанна отцом современного искусства, на которого опирались и Пикассо, и Матисс."},{id:"vangogh-arena",title:"Арена в Арле",author:"Винсент Ван Гог",date:"1888",material:"Холст, масло",kind:"painting",art:"garena",palette:["#d8a83a","#3a5a3a","#c84a2a","#2a3a6a"],text:"Жарким днём толпа зрителей заполнила древнеримскую арену в Арле, где устраивались корриды. Ван Гог изобразил не столько бой, сколько саму публику: яркие пятна платьев, шляп и зонтиков. Плоские цветовые формы и чёткие контуры напоминают японские гравюры, которыми увлекался художник. В Арле он провёл самый плодотворный и самый трагический год своей жизни."},{id:"rodin",title:"Вечная весна",author:"Огюст Роден",date:"Модель 1884, мрамор начала 1900-х",material:"Мрамор",kind:"statue",art:"rodin",high:!0,text:"Юноша и девушка слились в порыве чувства. Роден оставил часть мрамора нетронутой, так что фигуры словно рождаются из камня, — этот приём «незавершённости» стал его визитной карточкой. Композиция пользовалась огромным успехом, и мастерская Родена выполнила несколько её мраморных вариантов. Сам скульптор говорил, что его искусство — это поиск жизни в камне."}]},{name:"Матисс и Пикассо",hall:"Главный штаб · Искусство XX века",style:"modern",wall:"#eceae4",wall2:"#dcd8ce",trim:"#9a9a96",ceiling:"#e6e2da",floor:"parquet",pillar:"none",exhibits:[{id:"matisse-music",title:"Музыка",author:"Анри Матисс",date:"1910",material:"Холст, масло",kind:"painting",art:"gmusic",palette:["#1f4fa0","#2f8a3a","#d2462a"],text:"Пара к знаменитому «Танцу», написанная по заказу Сергея Щукина для лестницы его московского особняка. Пять красных фигур на зелёном холме под синим небом: один играет на скрипке, другой на флейте, трое поют. Если «Танец» — это вихрь движения, то «Музыка» — застывшая тишина и сосредоточенность. Всего три цвета передают первобытную силу искусства."},{id:"picasso-three",title:"Три женщины",author:"Пабло Пикассо",date:"1908",material:"Холст, масло",kind:"painting",art:"gcubist",palette:["#b8562a","#6a3a2a","#4a6a5a","#d88a5a"],text:"Монументальное полотно стоит у истоков кубизма. Три массивные фигуры словно вырублены из камня или дерева: Пикассо в это время увлекался африканской скульптурой. Объём строится гранями, а тёплые терракотовые тона чередуются с зеленоватыми тенями. Картину приобрёл Сергей Щукин, который одним из первых поверил в молодого испанца."},{id:"kandinsky",title:"Композиция VI",author:"Василий Кандинский",date:"1913",material:"Холст, масло",kind:"painting",art:"gabstract",palette:["#e8d8b0","#2a4aa0","#c8322a","#e8b83a"],text:"Одно из главных произведений абстрактного искусства. Кандинский полгода работал над темой Всемирного потопа, но затем, по его словам, отбросил сюжет и оставил «чистое звучание» цвета и линии. В вихре цветовых пятен угадывается стихия, разрушающая и одновременно обновляющая мир. Художник называл свои «Композиции» симфониями и считал их главными работами."}]},{name:"Запасные галереи. Новое искусство",hall:"Собрания Щукина и Морозова",style:"storage",wall:"#e8e6e0",wall2:"#dad7cf",trim:"#8c8c8c",ceiling:"#cfccc4",floor:"concrete",pillar:"rack",exhibits:[{id:"dance",title:"Танец",author:"Анри Матисс",date:"1910",material:"Холст, масло",kind:"painting",art:"dance",palette:["#1f4fa0","#2f8a3a","#d2462a"],text:"Монументальное панно заказал Матиссу московский коллекционер Сергей Щукин для лестницы своего особняка. Пять красных фигур кружатся в хороводе на зелёном холме под синим небом — всего три цвета передают первобытную радость движения. Щукин сначала колебался, опасаясь откровенности образов, но затем принял работу. После революции коллекция была национализирована, и с 1948 года «Танец» хранится в Эрмитаже."},{id:"red-room",title:"Красная комната (Гармония в красном)",author:"Анри Матисс",date:"1908",material:"Холст, масло",kind:"painting",art:"redroom",palette:["#c22a20","#1f3f8a","#e7c85a","#5a9a5a"],text:"Поначалу картина была «Гармонией в голубом», но, уже закончив её, Матисс переписал фон красным. Скатерть и стена сливаются в единую плоскость, по которой вьются синие арабески, а окно открывается в весенний сад. Пространство здесь создаётся не перспективой, а цветом. Картину также приобрёл Сергей Щукин."},{id:"black-square",title:"Чёрный квадрат",author:"Казимир Малевич",date:"Ок. 1932",material:"Холст, масло",kind:"painting",art:"square",high:!0,text:"Малевич написал «Чёрный квадрат» впервые в 1915 году, провозгласив рождение супрематизма — искусства «чистого чувства», освобождённого от изображения предметов. Позднее он создал ещё несколько вариантов. Эрмитажный вариант принадлежал родственникам художника; в 2002 году предприниматель Владимир Потанин купил его и передал в дар музею."},{id:"lilac",title:"Куст сирени",author:"Винсент Ван Гог",date:"1889",material:"Холст, масло",kind:"painting",art:"lilac",palette:["#5a8a3a","#8a7ac8","#e8d870","#2a4a2a"],text:"Картина написана в мае 1889 года в саду лечебницы Сен-Поль-де-Мозоль близ Сен-Реми, куда художник добровольно лёг на лечение. Пышный куст сирени передан энергичными, извилистыми мазками — кажется, что листья и цветы движутся и дышат. Ван Гог жадно писал всё, что видел за стенами больницы: ирисы, оливы, кипарисы. За год, проведённый в Сен-Реми, он создал около полутора сотен картин."},{id:"gauguin",title:"Женщина, держащая плод (Куда ты идёшь?)",author:"Поль Гоген",date:"1893",material:"Холст, масло",kind:"painting",art:"gauguin",palette:["#c86a2a","#2a6a4a","#e8b84a","#6a2a6a"],text:"Гоген уехал на Таити в поисках «рая», не тронутого цивилизацией. Таитянка держит в руках плод, похожий на тыкву, а позади — хижина, деревья и женщины. Чистые, яркие цвета — оранжевый, изумрудный, жёлтый — плоскостны, как в витраже. Таитянское название картины переводится «Куда ты идёшь?». Полотно поступило в Эрмитаж из собраний московских коллекционеров начала XX века."},{id:"absinthe",title:"Любительница абсента",author:"Пабло Пикассо",date:"1901",material:"Холст, масло",kind:"painting",art:"absinthe",palette:["#2a4a7a","#c84a3a","#e8d0b0","#3a6a8a"],text:"Двадцатилетний Пикассо только приехал в Париж и писал жизнь его кафе. Одинокая женщина сидит за столиком, обхватив себя непомерно длинной рукой, — этот выразительный жест передаёт замкнутость и тоску. Картина стоит на пороге «голубого периода», когда художник обратился к образам бедности и одиночества. Её приобрёл Сергей Щукин, одним из первых оценивший молодого испанца."},{id:"samary",title:"Портрет актрисы Жанны Самари",author:"Огюст Ренуар",date:"1878",material:"Холст, масло",kind:"painting",art:"samary",palette:["#d97a6a","#e9d6c9","#2a3a5a","#c7a07a"],text:"Жанна Самари — молодая актриса театра «Комеди Франсез», которую Ренуар писал несколько раз. Этот парадный портрет в полный рост был показан в Салоне 1879 года. Лёгкие мазки, розово-золотистый фон и обаятельная улыбка модели передают атмосферу Парижа импрессионистов. Картина принадлежала московскому коллекционеру Ивану Морозову."}]},{name:"Нумизматика",hall:"Отдел нумизматики",style:"coins",wall:"#3d2c22",wall2:"#33251c",trim:"#c9a24a",ceiling:"#271b14",floor:"herringbone",pillar:"pilaster",chandelier:!0,warden:!0,exhibits:[{id:"owl",title:"Афинская тетрадрахма «Сова»",date:"V в. до н. э.",material:"Серебро",kind:"coins",art:"silver",text:"Самая известная монета античности. На лицевой стороне — профиль богини Афины в шлеме, на оборотной — сова, ветвь оливы и буквы ΑΘΕ, «афиняне». Монета чеканилась из серебра Лаврийских рудников и ходила по всему Средиземноморью. Выражение «везти сов в Афины» означало делать что-то бессмысленное — как в русском «ехать в Тулу со своим самоваром»."},{id:"srebrenik",title:"Сребреник Владимира Святославича",date:"Конец X — начало XI в.",material:"Серебро",kind:"coins",art:"silver",high:!0,text:"Одни из первых монет, отчеканенных на Руси. На лицевой стороне — князь Владимир на троне, с нимбом и в венце, на оборотной — родовой знак Рюриковичей, трезубец. Надпись гласит: «Владимир на столе, а се его сребро». Сребреники известны в небольшом количестве — около четырёх сотен экземпляров, — и каждый является бесценным историческим документом."},{id:"konstantin",title:"Константиновский рубль",date:"1825",material:"Серебро",kind:"coins",art:"silver",text:"Одна из легендарных редкостей мировой нумизматики. После смерти Александра I в 1825 году наследником считался великий князь Константин Павлович, и Монетный двор отчеканил пробные рубли с его портретом. Но Константин отрёкся от престола, императором стал Николай I, и монеты так и не вышли в обращение. Известно лишь несколько подлинных экземпляров."},{id:"sestroretsk",title:"Сестрорецкий рубль",date:"1771",material:"Медь",kind:"coins",art:"copper",text:"Медная монета номиналом в один рубль весит более килограмма и имеет диаметр около 7,5 сантиметра. Её отчеканили на Сестрорецком монетном дворе в пробном порядке, задумав заменить серебро медью, но проект оказался непрактичным: носить такие «деньги» было тяжело. Большинство дошедших монет — новоделы XIX века."},{id:"platinum",title:"Платиновые монеты Николая I",date:"1828–1845",material:"Платина",kind:"coins",art:"platinum",text:"Россия стала первой в мире страной, выпустившей платиновые монеты для обращения. На Урале открыли богатые месторождения платины, и по предложению министра финансов Егора Канкрина начали чеканить монеты номиналом 3, 6 и 12 рублей. Их называли «уральскими червонцами». В 1845 году чеканку прекратили — курс платины оказался нестабильным."}]},{name:"Искусство Китая и Центральной Азии",hall:"Залы Дуньхуана и Хара-Хото",style:"asia",wall:"#6a1f1a",wall2:"#5a1915",trim:"#d4ab4c",ceiling:"#2a1410",floor:"parquet",pillar:"lacquer",warden:!0,exhibits:[{id:"dunhuang",title:"Скульптура из пещер Могао (Дуньхуан)",date:"VII–X вв.",material:"Глина, роспись",kind:"buddha",text:"Пещерные храмы Могао у оазиса Дуньхуан на Великом шёлковом пути — сокровищница буддийского искусства. В 1914–1915 годах там работала экспедиция академика Сергея Ольденбурга, которая привезла в Петербург скульптуры, фрагменты росписей и рукописи. Расписанные глиняные фигуры бодхисаттв с мягкими улыбками и спокойными жестами принадлежат эпохе династии Тан."},{id:"amitabha",title:"Будда Амитабха из Хара-Хото",date:"XII–XIII вв.",material:"Шёлк, минеральные краски",kind:"thangka",high:!0,text:"Мёртвый город Хара-Хото в пустыне Гоби был открыт экспедицией Петра Козлова в 1908–1909 годах. В «знаменитом субургане» нашли тысячи книг и сотни икон тангутского государства Си Ся. На этой иконе Будда Амитабха встречает душу праведника, чтобы проводить её в Чистую землю. Тангутская живопись была почти неизвестна миру, пока её не открыли русские исследователи."},{id:"noin-ula",title:"Ткани из курганов Ноин-Улы",date:"I в. до н. э. — I в. н. э.",material:"Шерсть, шёлк",kind:"carpet",art:"noinula",text:"В 1924 году экспедиция Козлова в Монголии раскопала погребения знати кочевников-хунну. В заполненных водой и промёрзших камерах сохранились ковры, китайские шёлка и даже пряди волос. На знаменитом войлочном ковре изображены сцены борьбы хищников с яками и оленями — тот же «звериный стиль», что и у скифов, только на другом краю степного мира."},{id:"qing-vase",title:"Фарфор эпохи Цин",date:"XVIII в.",material:"Фарфор, подглазурная роспись кобальтом",kind:"vase",art:"porcelain",text:"Китайский фарфор ценился в Европе на вес золота. В России увлечение «китайщиной» началось при Петре I, а при Екатерине II в императорских дворцах появились целые китайские кабинеты. Эрмитажная коллекция включает тысячи предметов — от тончайших чашек «яичная скорлупа» до огромных напольных ваз с драконами, символом императорской власти."}]},{name:"Искусство Ирана, Средней Азии и Японии",hall:"Залы Востока",style:"asia",wall:"#244a5a",wall2:"#1d3e4c",trim:"#d4ab4c",ceiling:"#13262e",floor:"herringbone",pillar:"lacquer",chandelier:!0,exhibits:[{id:"sasanian",title:"Сасанидское серебряное блюдо с царской охотой",date:"Иран, IV в.",material:"Серебро, позолота",kind:"plate",text:"Эрмитаж обладает крупнейшей в мире коллекцией сасанидского серебра. Большинство блюд найдено не в Иране, а в Приуралье: их привозили сюда купцы, выменивая на меха. Местные народы почитали блюда как священные предметы. Излюбленный сюжет — царь на коне, поражающий из лука львов или кабанов: охота символизировала победу правителя над силами хаоса."},{id:"penjikent",title:"Фрески Пенджикента",date:"Согд, VII–VIII вв.",material:"Лёсс, клеевые краски",kind:"fresco",art:"sogd",high:!0,text:"Древний согдийский город Пенджикент в Таджикистане называют «Помпеями Средней Азии». Археологи обнаружили, что стены жилых домов и храмов были покрыты яркими росписями: пиры, битвы героев, эпические сказания. Хрупкие фрески снимали со стен по особой технологии, а затем реставрировали в Эрмитаже десятилетиями. Здесь можно увидеть, как жили купцы Великого шёлкового пути."},{id:"bobrinsky",title:"Ведро Бобринского",date:"Герат, 1163",material:"Бронза, инкрустация серебром и медью",kind:"vase",art:"bronze",text:"Шедевр средневекового исламского искусства. Бронзовое ведро для бани украшено инкрустацией серебром и медью: пирующие, музыканты, всадники на охоте, игроки в нарды и благопожелательные надписи. Надпись сообщает, что его изготовили в Герате в 1163 году мастер-литейщик и мастер-инкрустатор для купца. Название ведро получило по имени графа А. А. Бобринского, в чьей коллекции оно хранилось."},{id:"samurai",title:"Самурайский доспех",date:"Япония, XVIII–XIX вв.",material:"Железо, лак, шёлковые шнуры",kind:"armor",text:"Японский доспех состоит из сотен лакированных пластин, связанных цветными шёлковыми шнурами. Шлем кабуто украшали рогами-кувагата, а лицо защищала маска с усами, придававшая воину устрашающий вид. В эпоху мира Эдо доспехи стали скорее церемониальными и превратились в настоящие произведения декоративного искусства."},{id:"netsuke",title:"Японские нэцкэ",date:"XVIII–XIX вв.",material:"Слоновая кость, дерево",kind:"case",art:"netsuke",text:"Традиционное кимоно не имело карманов, и японцы подвешивали к поясу кисет, коробочку для лекарств или печатей. Чтобы шнурок не выскальзывал, на его конец крепили миниатюрную фигурку-противовес — нэцкэ. Мастера вырезали крошечных животных, богов счастья, сценки из жизни, наделяя каждую фигурку характером и юмором."}]}]}],n3=["Эрмитажные коты живут в музее со времён Елизаветы Петровны — она велела привезти «котов отменно больших» из Казани для борьбы с мышами.","У эрмитажных котов есть собственный день — День эрмитажного кота, который празднуют весной.","Котов в Эрмитаже около пятидесяти. У каждого есть паспорт и ветеринарная книжка.","Коты живут в подвалах Зимнего дворца, и у них есть своя кухня и даже больница.","Котов, переживших блокаду, не осталось — после войны в Эрмитаж привезли два вагона котов.","Екатерина II называла котов «галерейными охранниками» и запретила им входить в парадные залы.","Служители Эрмитажа ищут котам заботливых хозяев — взять кота из музея можно официально.","Эрмитажные коты охраняют произведения искусства от грызунов — работа ответственная!","Говорят, что коты отличают картины Рембрандта от картин Рубенса. Но это не точно.","Котам дают звучные имена: среди них встречаются Рафаэли, Тицианы, Гоги и даже Эрмитажики."],sd=["«Молодой человек, не трогайте экспонаты!»","«Здесь нельзя бегать! Это вам не стадион!»","«Фотографировать со вспышкой запрещено!»","«Отойдите от витрины, пожалуйста!»","«Вы билет покупали? Ну, тогда ходите тихо.»","«За ленточку не заходить!»"];let ca=1280;const Pe=720;function i3(a){ca=Math.max(480,Math.round(a))}const E=600,fe=84,Fa=400,Ir=E-165,ju=560,dd=["Рафаэль","Тициан","Мурка-Екатерина","Барон","Дуся","Кузя","Пушкин","Ван Гог","Ассирийка","Нефертити","Фараон","Сфинкс","Василиса","Рембрандт","Матисс"],cd=["#e08a3c","#6b6b6b","#2a2a2a","#d9c8a8","#b06a2c","#8a7a6a"];let _d=0;function Fr(a){const s=La[a],u=[],r=[],i=[],f=[],h=[],v=[];_d=a*5;let o=0;return v.push({x:0,w:ju,dir:a===0?"entrance":"down"}),o+=ju,s.rooms.forEach((c,b)=>{const g=c.exhibits.length,p=Math.max(1e3,260+g*Fa+180),M={room:c,x:o,w:p,idx:b};u.push(M),c.exhibits.forEach((W,te)=>{const ue=o+330+te*Fa;let ae=E;W.high&&(ae=Ir,i.push({x:ue-140,y:Ir,w:280,kind:"balcony"}),i.push({x:ue-250,y:E-72,w:100,kind:"bench"})),r.push({ex:W,x:ue,baseY:ae,roomIdx:b})});for(let W=0;W<g-1;W++){const te=c.exhibits[W],ue=c.exhibits[W+1];!te.high&&!ue.high&&(W+b)%2===0&&i.push({x:o+330+W*Fa+Fa/2-50,y:E-46,w:100,kind:"step"})}c.warden&&f.push({x:o+p/2,minX:o+120,maxX:o+p-120,dir:b%2?1:-
